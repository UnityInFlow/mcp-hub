name: Release

# Trigger: push a v* tag (e.g., git tag v0.1.1 && git push origin v0.1.1)
# NOTE: 0.1.0 is already published on crates.io (immutable); this pipeline ships
# the binstall-metadata + prebuilt-binaries release as 0.1.1 (03-TOOLING-PINS.md).
# This produces downloadable, cargo-binstall-resolvable binaries for 6 targets
# (Linux x86_64/aarch64 gnu + musl, macOS x86_64/aarch64) and publishes the
# crate to crates.io -- all without manual intervention. The deliberate v* tag + the
# preflight dry-run ARE the gate (crates.io publish is immediate and yank-only;
# there is no reviewable staging bundle, so there is intentionally NO human gate).
on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  # Pinned toolchain for cargo-zigbuild cross-compilation (see 03-TOOLING-PINS.md).
  # NEVER use "latest" -- zig <-> cargo-zigbuild compatibility is version-coupled.
  ZIG_VERSION: '0.14.1'
  CARGO_ZIGBUILD_VERSION: '0.23.0'

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1: preflight
  # Validates that the git tag version matches Cargo.toml version, and that
  # cargo publish --dry-run passes. Fails fast on any mismatch.
  # Addresses: tag/version consistency, dry-run before release.
  # ──────────────────────────────────────────────────────────────────────────
  preflight:
    name: Preflight (tag/version check + publish dry-run)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Validate tag matches Cargo.toml version
        id: extract-version
        run: |
          TAG="${GITHUB_REF##refs/tags/}"
          VERSION="${TAG#v}"
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')

          echo "Git tag version:    ${VERSION}"
          echo "Cargo.toml version: ${CARGO_VERSION}"

          if [ "${VERSION}" != "${CARGO_VERSION}" ]; then
            echo "ERROR: Git tag version '${VERSION}' does not match Cargo.toml version '${CARGO_VERSION}'"
            echo "Fix: Update Cargo.toml version to match the tag before pushing."
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Tag/version check passed: v${VERSION}"

      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2: test
  # Full test gate: cargo test + clippy + fmt check.
  # Build jobs do not start until this passes.
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Test gate (test + clippy + fmt)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: cargo test
        run: cargo test --locked

      - name: cargo clippy
        run: cargo clippy -- -D warnings

      - name: cargo fmt check
        run: cargo fmt --check

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 3: build-binaries
  # ONE GitHub-hosted Linux runner (ubuntu-latest, x86_64) cross-compiles all
  # four Linux targets via cargo-zigbuild (zig is host-arch-independent, so this
  # whole matrix runs on a single Linux host -- no per-arch runner, no
  # Docker/cross). macOS targets are built natively in the build-macos job.
  #
  # Assets are named after the CRATE (`mcp-server-hub-<target>-v<version>.<ext>`),
  # NOT the binary (`mcp-hub`), so cargo binstall's default {name} template
  # (name = crate = mcp-server-hub) resolves them (D-02 / HUB-04).
  #
  # macOS targets are built in the separate build-macos job (macos-14).
  # Windows is a REDUCED non-unix CLI: nix/axum/dirs/comfy-table/owo-colors/
  # dialoguer/tower-http/askama are [target.'cfg(unix)'.dependencies], so the
  # Windows binary has no daemon/web-UI/signal handling -- documented in the
  # release notes + README, smoke-tested by build success + presence of the
  # .exe in the archive (it is not runnable on the Linux build host).
  # ──────────────────────────────────────────────────────────────────────────
  build-binaries:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      # fail-fast disabled (#03-04): surface ALL target failures in one run instead
      # of one-at-a-time cancel-and-retry. The release job still requires every
      # configured target to succeed, so a partial set never ships.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            ext: tgz
          - target: aarch64-unknown-linux-gnu
            ext: tgz
          - target: x86_64-unknown-linux-musl
            ext: tgz
          - target: aarch64-unknown-linux-musl
            ext: tgz
          # x86_64-pc-windows-gnu DEFERRED to v2 (HUB-V2-02): the CLI's unix-gated
          # deps (chrono/rand/owo_colors/comfy_table/dialoguer/dirs are pulled under
          # cfg(unix) and used unguarded) don't cross-compile to Windows. Re-add with
          # proper cfg gating in a later release (alongside macOS, HUB-V2-01).
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install pinned zig + cargo-zigbuild
        run: |
          # Pinned versions (03-TOOLING-PINS.md): zig 0.14.1, cargo-zigbuild 0.23.0.
          # Install zig from the official tarball matched to the HOST arch
          # (x86_64 on ubuntu-latest). zig itself cross-compiles to all targets,
          # so only the host arch matters here. Pin BOTH versions -- never `latest`.
          set -euo pipefail
          case "$(uname -m)" in
            aarch64|arm64) ZIG_ARCH=aarch64 ;;
            x86_64|amd64)  ZIG_ARCH=x86_64 ;;
            *) echo "unsupported host arch: $(uname -m)" >&2; exit 1 ;;
          esac
          # zig 0.14.0+ uses arch-first artifact naming: zig-<arch>-linux-<ver> (was zig-linux-<arch>-<ver>).
          ZIG_DIR="zig-${ZIG_ARCH}-linux-${ZIG_VERSION}"
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${ZIG_DIR}.tar.xz" -o /tmp/zig.tar.xz
          mkdir -p "$HOME/.zig" && tar -xJf /tmp/zig.tar.xz -C "$HOME/.zig"
          echo "$HOME/.zig/${ZIG_DIR}" >> "$GITHUB_PATH"
          "$HOME/.zig/${ZIG_DIR}/zig" version
          cargo install --locked --version "${CARGO_ZIGBUILD_VERSION}" cargo-zigbuild

      - name: Build (cargo zigbuild, cross-compiled from this Linux host)
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Package (crate-named, binstall-compatible; flat archive)
        run: |
          VERSION="${GITHUB_REF##refs/tags/v}"
          BIN="mcp-hub${{ matrix.binext }}"
          OUT="mcp-server-hub-${{ matrix.target }}-v${VERSION}.${{ matrix.ext }}"
          SRC="target/${{ matrix.target }}/release"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            # Windows: flat .zip containing just mcp-hub.exe (reduced non-unix CLI)
            (cd "$SRC" && zip "$OLDPWD/$OUT" "$BIN")
          else
            # Linux: flat .tgz containing just the mcp-hub binary (no wrapping dir)
            tar czf "$OUT" -C "$SRC" "$BIN"
          fi
          sha256sum "$OUT" > "$OUT.sha256"
          echo "Packaged: $OUT"

      - name: 'Smoke test (Linux: --version; Windows: build+presence only)'
        run: |
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-gnu" ]; then
            # Windows binary is a reduced non-unix CLI cross-built on Linux -- it is
            # not runnable on this host. Rely on a successful build + the .exe being
            # present in the archive (Pitfall 2). Do NOT attempt to execute it.
            test -f "target/${{ matrix.target }}/release/mcp-hub.exe" || {
              echo "ERROR: mcp-hub.exe missing from the Windows build"
              exit 1
            }
            echo "Windows reduced-CLI build present (not executed on Linux host)."
          else
            # A cross-compiled binary can only be EXECUTED when its arch matches the
            # runner's arch. Decide host-vs-target arch at runtime rather than
            # hardcoding a triple (running a foreign-arch binary fails with
            # "Exec format error").
            BIN_PATH="target/${{ matrix.target }}/release/mcp-hub"
            test -f "$BIN_PATH" || { echo "ERROR: $BIN_PATH missing"; exit 1; }
            TARGET_ARCH="${{ matrix.target }}"; TARGET_ARCH="${TARGET_ARCH%%-*}"   # x86_64 | aarch64
            HOST_ARCH="$(uname -m)"; [ "$HOST_ARCH" = "arm64" ] && HOST_ARCH=aarch64
            if [ "$TARGET_ARCH" = "$HOST_ARCH" ]; then
              "$BIN_PATH" --version
            else
              echo "Cross-built $TARGET_ARCH on $HOST_ARCH host -- presence-only (not natively executable)."
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.target }}
          path: |
            mcp-server-hub-*

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 3b: build-macos
  # Native macOS builds on macos-14 (Apple Silicon). The Apple toolchain
  # cross-compiles x86_64 natively after `rustup target add`, so no zig is
  # needed. Same flat, crate-named .tgz layout as the Linux job. Only the
  # aarch64 build (host arch) is executed for the smoke test.
  # ──────────────────────────────────────────────────────────────────────────
  build-macos:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (crate-named, binstall-compatible; flat archive)
        run: |
          VERSION="${GITHUB_REF##refs/tags/v}"
          BIN="mcp-hub"
          OUT="mcp-server-hub-${{ matrix.target }}-v${VERSION}.tgz"
          SRC="target/${{ matrix.target }}/release"
          # flat .tgz containing just the mcp-hub binary (no wrapping dir)
          tar czf "$OUT" -C "$SRC" "$BIN"
          shasum -a 256 "$OUT" > "$OUT.sha256"
          echo "Packaged: $OUT"

      - name: Smoke test (--version, host arch only)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/mcp-hub"
          test -f "$BIN_PATH" || { echo "ERROR: $BIN_PATH missing"; exit 1; }
          "$BIN_PATH" --version

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.target }}
          path: |
            mcp-server-hub-*

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 4: release
  # Requires ALL build-binaries matrix targets to succeed -- no partial release.
  # Validates all 6 expected archives exist before creating the release,
  # generates SHA256SUMS.txt, and creates the GitHub Release with the
  # crate-named assets. The tap-formula step is deferred.
  # ──────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-binaries, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          merge-multiple: true
          path: artifacts/

      - name: Validate all 6 expected archives exist
        run: |
          VERSION="${GITHUB_REF##refs/tags/v}"
          echo "Validating release artifacts for v${VERSION}..."
          for f in \
            "mcp-server-hub-x86_64-unknown-linux-gnu-v${VERSION}.tgz" \
            "mcp-server-hub-aarch64-unknown-linux-gnu-v${VERSION}.tgz" \
            "mcp-server-hub-x86_64-unknown-linux-musl-v${VERSION}.tgz" \
            "mcp-server-hub-aarch64-unknown-linux-musl-v${VERSION}.tgz" \
            "mcp-server-hub-aarch64-apple-darwin-v${VERSION}.tgz" \
            "mcp-server-hub-x86_64-apple-darwin-v${VERSION}.tgz"; do
            if test -f "artifacts/$f"; then
              echo "OK: $f"
            else
              echo "MISSING: $f"
              exit 1
            fi
          done
          echo "All 6 release artifacts validated (Windows deferred to v2)."

      - name: Generate SHA256SUMS.txt
        run: |
          VERSION="${GITHUB_REF##refs/tags/v}"
          cd artifacts
          sha256sum \
            "mcp-server-hub-x86_64-unknown-linux-gnu-v${VERSION}.tgz" \
            "mcp-server-hub-aarch64-unknown-linux-gnu-v${VERSION}.tgz" \
            "mcp-server-hub-x86_64-unknown-linux-musl-v${VERSION}.tgz" \
            "mcp-server-hub-aarch64-unknown-linux-musl-v${VERSION}.tgz" \
            "mcp-server-hub-aarch64-apple-darwin-v${VERSION}.tgz" \
            "mcp-server-hub-x86_64-apple-darwin-v${VERSION}.tgz" \
            > SHA256SUMS.txt
          echo "Generated SHA256SUMS.txt:"
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/mcp-server-hub-*.tgz
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Installation

            > The crate is published as `mcp-server-hub`; it installs a binary named **`mcp-hub`**.

            **Prebuilt binary (fastest):**
            ```bash
            cargo binstall mcp-server-hub      # downloads a prebuilt mcp-hub binary
            ```

            **From source:**
            ```bash
            cargo install mcp-server-hub       # compiles and installs the mcp-hub binary
            ```

            **Direct download:** grab the appropriate archive below and extract the `mcp-hub` binary.

            | Platform | Archive |
            |----------|---------|
            | Linux x86_64 (gnu) | `mcp-server-hub-x86_64-unknown-linux-gnu-v<version>.tgz` |
            | Linux aarch64 (gnu) | `mcp-server-hub-aarch64-unknown-linux-gnu-v<version>.tgz` |
            | Linux x86_64 (musl) | `mcp-server-hub-x86_64-unknown-linux-musl-v<version>.tgz` |
            | Linux aarch64 (musl) | `mcp-server-hub-aarch64-unknown-linux-musl-v<version>.tgz` |
            | macOS Apple Silicon (aarch64) | `mcp-server-hub-aarch64-apple-darwin-v<version>.tgz` |
            | macOS Intel (x86_64) | `mcp-server-hub-x86_64-apple-darwin-v<version>.tgz` |

            > **Windows** prebuilt binaries are **deferred to v2** (HUB-V2-02).
            > On Windows install from source with `cargo install mcp-server-hub`.

            ## Checksums
            See `SHA256SUMS.txt` for verification.

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 5: publish-crates
  # Publishes the crate to crates.io AFTER the GitHub Release succeeds.
  # FAIL-LOUD (D-03 / HUB-05): this job is NOT marked non-blocking -- a registry
  # or token failure (e.g. CARGO_REGISTRY_TOKEN missing publish scope) now fails
  # the workflow instead of showing a false green.
  #
  # NO human-approval / environment-protection gate (D-04): crates.io publish is
  # immediate and yank-only -- there is no reviewable staging bundle to approve.
  # The deliberate v* tag + the JOB-1 dry-run preflight ARE the gate.
  # ──────────────────────────────────────────────────────────────────────────
  publish-crates:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: cargo publish (requires CARGO_REGISTRY_TOKEN with publish scope)
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
